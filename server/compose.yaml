# Run from server/: docker compose up -d --build
# This optional stack includes a dedicated database. Native/Baota can use existing MySQL.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${PCTIME_DB_NAME:-pctime}
      MYSQL_USER: ${PCTIME_DB_USER:-pctime}
      MYSQL_PASSWORD: ${PCTIME_DB_PASSWORD:?Set PCTIME_DB_PASSWORD in server/.env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      PCTIME_DB_HOST: db
      PCTIME_DB_PORT: "3306"
      PCTIME_DB_USER: ${PCTIME_DB_USER:-pctime}
      PCTIME_DB_NAME: ${PCTIME_DB_NAME:-pctime}
      PCTIME_DB_INIT_SCHEMA: "1"
      PCTIME_HOST: 0.0.0.0
      PCTIME_PORT: "8000"
      TZ: Asia/Shanghai
    ports:
      - "${PCTIME_PUBLISH_HOST:-127.0.0.1}:${PCTIME_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    restart: unless-stopped
volumes:
  mysql-data:
