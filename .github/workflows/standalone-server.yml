name: Standalone server and client sync
on:
  push:
  pull_request:
jobs:
  server-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install server dependencies only
        run: python -m pip install -r server/requirements.txt
      - name: Check all deployed modules
        run: python server/check.py
      - name: Install disposable MySQL binary
        run: sudo apt-get update && sudo apt-get install -y mysql-server
      - name: Verify isolated deployment, migrations and offline client sync
        run: python server/tools/verify_mysql.py --mysqld /usr/sbin/mysqld --client client
      - name: Package server without secrets
        run: python server/tools/package.py --output pctime-server.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pctime-server
          path: pctime-server.zip
